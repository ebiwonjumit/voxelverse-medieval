name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR or branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Shared runners are slower than a laptop; tests/perf.ts multiplies the wall-clock limits by this.
      PERF_TOLERANCE: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
